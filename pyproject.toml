[tool.poetry]
name = "tap-flowpay-universal-file"
version = "0.1.0"
description = "`tap-flowpay-universal-file` is a Singer tap that merges partner sales files pushed to Azure blob storage into a complete history, configured per partner, built with the Meltano Singer SDK."
readme = "README.md"
authors = ["Flowpay"]
keywords = [
    "ELT",
    "Azure Blob Storage",
    "GoKasa",
]
license = "Apache-2.0"
packages = [{ include = "tap_flowpay_universal_file" }]

[tool.poetry.dependencies]
python = "<3.12,>=3.8"
singer-sdk = { version="~0.31.0" }
azure-storage-blob = "^12.19.0"
azure-identity = ">=1.17.1,<2"
jsonschema = ">=4.18,<5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
]
select = ["ALL"]
src = ["tap_flowpay_universal_file"]
target-version = "py38"

[tool.ruff.isort]
known-first-party = ["tap_flowpay_universal_file"]

[tool.ruff.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration. tap-gokasa keeps pipelines configured with the old executable name running.
tap-flowpay-universal-file = 'tap_flowpay_universal_file.tap:TapFlowpayUniversalFile.cli'
tap-gokasa = 'tap_flowpay_universal_file.tap:TapFlowpayUniversalFile.cli'
